[package]
name = "sizelens"
version = "0.1.0"
edition = "2021"
description = "Folder sizes in Windows File Explorer's Comments column, via desktop.ini InfoTip"
license = "MIT"
repository = "https://github.com/Jviat0r/sizelens"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "sizelens"
path = "src/main.rs"

[[bin]]
name = "sizelensw"
path = "src/bin/sizelensw.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
